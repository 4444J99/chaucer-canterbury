[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaucer-canterbury"
version = "1.0.0"
description = "Protocol-bound Middle English phonology, Author-Operator calibration, 30-pilgrim Kentish frame state, generative synthesis, and counterfactual validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.24",
]

[project.scripts]
chaucer-prosody = "chaucer_canterbury.cli:main"
chaucer-canterbury = "chaucer_canterbury.cli:main"
chaucer-canterbury-server = "chaucer_canterbury.server:main"

[tool.setuptools.packages.find]
where = ["src"]
